<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รับเงินค่าน้ำ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="common.js"></script>
<style>
  body{font-family:Sarabun,sans-serif;margin:0;background:#f3f4f6}
  header{background:#0f766e;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff}
  .tabs{display:flex}.tabs button{flex:1;padding:12px;border:0;background:#e5e7eb;font-size:16px;font-family:inherit}
  .tabs button.on{background:#fff;font-weight:700}
  main{padding:12px;max-width:640px;margin:auto}
  #q{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:10px;font-family:inherit}
  .item{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .top{display:flex;justify-content:space-between;gap:8px}
  .amt{font-size:22px;font-weight:700;color:#0f766e;white-space:nowrap}
  .btns{display:flex;gap:8px;margin-top:10px}
  .btns button,button.gray{flex:1;padding:12px;font-size:16px;border:0;border-radius:10px;color:#fff;background:#16a34a;font-family:inherit}
  .btns button.alt{background:#2563eb} button.gray{background:#6b7280;flex:none;padding:8px 14px}
  small{color:#6b7280}
  .void{opacity:.55}.void .amt{text-decoration:line-through}
  #qrBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center}
  #qrBox .in{background:#fff;border-radius:14px;padding:16px;text-align:center;width:min(92vw,380px)}
  #qrBox img.qr{width:240px;height:240px;image-rendering:pixelated}
</style>
</head>
<body>
<header><b>💰 รับเงินค่าน้ำ</b><a href="index.html">← หน้าจดมิเตอร์</a></header>
<div class="tabs"><button id="tUnpaid" class="on">ค้างชำระ</button><button id="tToday">รับวันนี้</button></div>
<main>
  <section id="sUnpaid">
    <input id="q" placeholder="🔍 ค้นบ้านเลขที่ ชื่อ หรือเลขที่บิล">
    <div id="list"></div>
  </section>
  <section id="sToday" style="display:none"><div id="todaySum"></div><div id="todayList"></div></section>
</main>

<div id="qrBox"><div class="in">
  <div id="qrTitle"></div><div id="qrImg"></div><div id="qrNote"></div>
  <div id="qrSwitch" style="margin:8px 0"></div>
  <p style="color:#b45309;font-size:14px">ตรวจในแอปธนาคารหรือดูสลิปให้แน่ใจว่าเงินเข้าแล้ว ก่อนกดยืนยัน</p>
  <div class="btns"><button class="alt" style="background:#6b7280" id="qrClose">ปิด</button><button id="qrOk">✅ ได้รับเงินโอนแล้ว</button></div>
</div></div>

<script>
let ROLE = '', ST = {}, UNPAID = [], busy = false, qrBill = null, qrUse = 'phone';

(async () => {
  const r = await requireLogin(); ROLE = r.role;
  if (!['admin', 'staff', 'cashier'].includes(ROLE)) { $('main').innerHTML = '<p>บัญชีนี้ไม่มีสิทธิ์รับเงิน</p>'; return; }
  const { data } = await sb.from('settings').select('*').eq('id', 1).single();
  ST = data || {};
  qrUse = ST.promptpay_phone ? 'phone' : 'tax';
  loadUnpaid();
})();

function tab(t) {
  $('#tUnpaid').classList.toggle('on', t === 'unpaid'); $('#tToday').classList.toggle('on', t === 'today');
  $('#sUnpaid').style.display = t === 'unpaid' ? '' : 'none'; $('#sToday').style.display = t === 'today' ? '' : 'none';
}
$('#tUnpaid').onclick = () => { tab('unpaid'); loadUnpaid(); };
$('#tToday').onclick = () => { tab('today'); loadToday(); };

async function loadUnpaid() {
  if (!navigator.onLine) return toast('ไม่มีอินเทอร์เน็ต หน้ารับเงินต้องออนไลน์', false);
  const { data, error } = await sb.from('bills')
    .select('id,bill_no,period,units,amount,households(house_no,owner_name)')
    .eq('status', 'unpaid').order('bill_no');
  if (error) return toast('โหลดไม่สำเร็จ: ' + error.message, false);
  UNPAID = data || []; renderUnpaid();
}

function renderUnpaid() {
  const k = $('#q').value.trim().toLowerCase();
  const L = UNPAID.filter(b => { const h = b.households || {};
    return !k || [h.house_no, h.owner_name, b.bill_no].some(x => String(x || '').toLowerCase().includes(k)); });
  $('#list').innerHTML = L.length ? L.map(b => { const h = b.households || {};
    return `<div class="item"><div class="top"><div><b>บ้านเลขที่ ${esc(h.house_no)}</b> ${esc(h.owner_name)}<br>
      <small>${esc(b.bill_no)} · ${thMonth(b.period)} · ${b.units} หน่วย</small></div><div class="amt">${money(b.amount)}</div></div>
      <div class="btns"><button data-pay="${b.id}">💵 รับเงินสด</button><button class="alt" data-qr="${b.id}">📲 โอน / QR</button></div></div>`;
  }).join('') : '<p style="text-align:center;color:#6b7280">ไม่มีบิลค้างชำระ</p>';
}
$('#q').oninput = renderUnpaid;
$('#list').onclick = e => {
  const p = e.target.closest('[data-pay]'), q = e.target.closest('[data-qr]');
  if (p) pay(+p.dataset.pay, 'cash');
  if (q) showQR(+q.dataset.qr);
};

function showQR(id) { qrBill = UNPAID.find(b => b.id === id); if (!qrBill) return; drawQR(); $('#qrBox').style.display = 'flex'; }
function drawQR() {
  const b = qrBill, h = b.households || {};
  const ids = { phone: ST.promptpay_phone, tax: ST.promptpay_tax_id };
  if (!ids[qrUse]) qrUse = ids.phone ? 'phone' : 'tax';
  const pl = promptpayPayload(ids[qrUse], b.amount);
  $('#qrTitle').innerHTML = `<b>บ้านเลขที่ ${esc(h.house_no)}</b> · ${esc(b.bill_no)}<div class="amt">${money(b.amount)} บาท</div>`;
  $('#qrImg').innerHTML = pl ? qrImg(pl) : '<p style="color:#dc2626">ยังไม่ได้ตั้งพร้อมเพย์ (แอดมินตั้งได้ที่หน้าออกบิล)</p>';
  $('#qrNote').textContent = 'ชื่อบัญชี ' + (ST.promptpay_name || '-') + ' · ' + (qrUse === 'phone' ? fmtPhone(ids.phone) : maskTax(ids.tax));
  $('#qrSwitch').innerHTML = (ids.phone && ids.tax)
    ? `<button class="gray" id="qrSw">สลับเป็น${qrUse === 'phone' ? 'เลขบัตรประชาชน' : 'เบอร์มือถือ'}</button>` : '';
  const sw = $('#qrSw'); if (sw) sw.onclick = () => { qrUse = qrUse === 'phone' ? 'tax' : 'phone'; drawQR(); };
}
$('#qrClose').onclick = () => ($('#qrBox').style.display = 'none');
$('#qrOk').onclick = () => qrBill && pay(qrBill.id, 'transfer');

async function pay(id, method) {
  if (busy) return;
  const b = UNPAID.find(x => x.id === id); if (!b) return;
  const h = b.households || {};
  if (!confirm(`ยืนยันรับเงิน${method === 'cash' ? 'สด' : 'โอน'}\n\nบ้านเลขที่ ${h.house_no} ${h.owner_name || ''}\nเลขที่ ${b.bill_no}\nจำนวน ${money(b.amount)} บาท`)) return;
  busy = true;
  const { error } = await sb.rpc('receive_payment', { p_bill_id: id, p_method: method });
  busy = false;
  if (error) return toast('บันทึกไม่สำเร็จ: ' + error.message, false);
  $('#qrBox').style.display = 'none';
  alert(`✅ บันทึกรับเงินแล้ว\n\nยื่นใบเสร็จเลขที่ ${b.bill_no} ให้ลูกบ้าน`);
  loadUnpaid();
}

async function loadToday() {
  const start = new Date(todayTH() + 'T00:00:00+07:00').toISOString();
  const { data, error } = await sb.from('payments')
    .select('id,amount,method,receipt_no,paid_at,received_name,voided_at,void_reason,bills(bill_no,households(house_no,owner_name))')
    .gte('paid_at', start).order('paid_at', { ascending: false });
  if (error) return toast('โหลดไม่สำเร็จ: ' + error.message, false);
  const ok = data.filter(p => !p.voided_at);
  const sum = m => ok.filter(p => p.method === m).reduce((a, p) => a + Number(p.amount), 0);
  $('#todaySum').innerHTML = `<div class="item"><b>รับวันนี้ ${ok.length} รายการ</b><br>
    💵 เงินสด ${money(sum('cash'))} บาท<br>📲 โอน ${money(sum('transfer'))} บาท<br>
    <b>รวม ${money(sum('cash') + sum('transfer'))} บาท</b></div>`;
  $('#todayList').innerHTML = data.map(p => { const h = (p.bills || {}).households || {};
    return `<div class="item ${p.voided_at ? 'void' : ''}"><div class="top"><div><b>${esc(p.receipt_no)}</b> บ้าน ${esc(h.house_no)}<br>
      <small>${thDateTime(p.paid_at)} · ${p.method === 'cash' ? 'เงินสด' : 'โอน'} · ${esc(p.received_name || '-')}</small>
      ${p.voided_at ? `<br><small style="color:#dc2626">ยกเลิกแล้ว: ${esc(p.void_reason)}</small>` : ''}</div>
      <div class="amt">${money(p.amount)}</div></div>
      ${ROLE === 'admin' && !p.voided_at ? `<div class="btns"><button style="background:#dc2626" data-void="${p.id}">ยกเลิกรายการนี้</button></div>` : ''}</div>`;
  }).join('') || '<p style="text-align:center;color:#6b7280">ยังไม่มีการรับเงินวันนี้</p>';
}
$('#todayList').onclick = async e => {
  const v = e.target.closest('[data-void]'); if (!v) return;
  const reason = prompt('เหตุผลที่ยกเลิก (ต้องใส่)'); if (!reason || !reason.trim()) return;
  const { error } = await sb.rpc('void_payment', { p_payment_id: +v.dataset.void, p_reason: reason.trim() });
  if (error) return toast('ยกเลิกไม่สำเร็จ: ' + error.message, false);
  toast('ยกเลิกแล้ว บิลกลับเป็นค้างชำระ'); loadToday();
};
</script>
</body>
</html>
